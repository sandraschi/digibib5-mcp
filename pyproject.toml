[project]
name = "digibib5-mcp"
version = "0.4.0"
description = "Digitale Bibliothek 5 reader clone - DKI format library + MCP server"
authors = [{ name = "Sandra Schipal" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2.0,<4",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio"]
dev = ["ruff>=0.16.0,<0.17", "pre-commit", "pyright"]

[project.scripts]
digibib5-mcp = "digibib5_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digibib5_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`.*:UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
